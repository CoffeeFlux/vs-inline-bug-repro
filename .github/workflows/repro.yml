name: MSVC ICE repro

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  repro:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The toolset the ICE was reported against: VS 2022 17.14 / MSVC 19.44.
          - label: vs2022-toolset-14.44
            runner: windows-2022
            toolset: '14.44'
          # Same 14.44 toolset family as shipped on the VS 2026 image
          # (servicing level may differ from the windows-2022 image).
          - label: vs2026-toolset-14.44
            runner: windows-2025-vs2026
            toolset: '14.44'
          # Newest toolset on the VS 2026 image: does a current compiler still crash?
          - label: vs2026-toolset-latest
            runner: windows-2025-vs2026
            toolset: ''
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        id: msvc
        run: ./scripts/setup-msvc.ps1 -VcVarsVer '${{ matrix.toolset }}' -Label '${{ matrix.label }}'

      # A red step below means cl.exe failed on that file; the step log and the
      # job summary table say whether it was an internal compiler error.
      # The workaround file is compiled first as the control: it must stay green
      # in every lane for the repro lanes to mean anything.

      - name: 'CONTROL workaround.cpp (default flags)'
        if: ${{ !cancelled() && steps.msvc.outcome == 'success' }}
        run: ./scripts/compile.ps1 -Source src/workaround.cpp

      - name: 'CONTROL workaround.cpp (/O2 /Zi)'
        if: ${{ !cancelled() && steps.msvc.outcome == 'success' }}
        run: ./scripts/compile.ps1 -Source src/workaround.cpp -Flags '/O2 /Zi'

      - name: 'REPRO repro_minimal.cpp (default flags)'
        if: ${{ !cancelled() && steps.msvc.outcome == 'success' }}
        run: ./scripts/compile.ps1 -Source src/repro_minimal.cpp

      - name: 'REPRO repro_minimal.cpp (/O2 /Zi)'
        if: ${{ !cancelled() && steps.msvc.outcome == 'success' }}
        run: ./scripts/compile.ps1 -Source src/repro_minimal.cpp -Flags '/O2 /Zi'

      - name: 'REPRO repro_full.cpp (default flags)'
        if: ${{ !cancelled() && steps.msvc.outcome == 'success' }}
        run: ./scripts/compile.ps1 -Source src/repro_full.cpp

      - name: 'REPRO repro_full.cpp (/O2 /Zi)'
        if: ${{ !cancelled() && steps.msvc.outcome == 'success' }}
        run: ./scripts/compile.ps1 -Source src/repro_full.cpp -Flags '/O2 /Zi'

      # Bisection variants, each isolating one ingredient repro_minimal.cpp
      # dropped. Default flags only: the crash is in the front end (msc1.cpp)
      # and run 1 showed optimization level does not matter.

      - name: 'BISECT A repro_fullclass.cpp (full class, plain fn)'
        if: ${{ !cancelled() && steps.msvc.outcome == 'success' }}
        run: ./scripts/compile.ps1 -Source src/repro_fullclass.cpp

      - name: 'BISECT B repro_lambda.cpp (wrap+lambda, no shadow)'
        if: ${{ !cancelled() && steps.msvc.outcome == 'success' }}
        run: ./scripts/compile.ps1 -Source src/repro_lambda.cpp

      - name: 'BISECT C repro_shadow.cpp (param named path, plain fn)'
        if: ${{ !cancelled() && steps.msvc.outcome == 'success' }}
        run: ./scripts/compile.ps1 -Source src/repro_shadow.cpp

      - name: 'BISECT B+C repro_lambda_shadow.cpp (wrap+lambda+shadow)'
        if: ${{ !cancelled() && steps.msvc.outcome == 'success' }}
        run: ./scripts/compile.ps1 -Source src/repro_lambda_shadow.cpp

      # Round-3 minimizations of the confirmed B+C trigger.

      - name: 'MIN min_iife.cpp (no wrap template, direct lambda call)'
        if: ${{ !cancelled() && steps.msvc.outcome == 'success' }}
        run: ./scripts/compile.ps1 -Source src/min_iife.cpp

      - name: 'MIN min_if.cpp (if condition instead of switch)'
        if: ${{ !cancelled() && steps.msvc.outcome == 'success' }}
        run: ./scripts/compile.ps1 -Source src/min_if.cpp

      - name: 'MIN min_expr.cpp (plain expression statement)'
        if: ${{ !cancelled() && steps.msvc.outcome == 'success' }}
        run: ./scripts/compile.ps1 -Source src/min_expr.cpp

      - name: 'MIN min_noenum.cpp (qualified cases, no using enum)'
        if: ${{ !cancelled() && steps.msvc.outcome == 'success' }}
        run: ./scripts/compile.ps1 -Source src/min_noenum.cpp

      - name: Upload compiler logs
        if: ${{ !cancelled() && steps.msvc.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.label }}
          path: logs/
          if-no-files-found: warn
