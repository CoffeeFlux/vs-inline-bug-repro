name: MSVC ICE repro

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  repro:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The toolset the ICE was reported against: VS 2022 17.14 / cl 19.44.
          - label: msvc-14.44
            runner: windows-2022
            toolset: '14.44'
          # Newest available toolset: red here means the bug is still unfixed.
          - label: msvc-latest
            runner: windows-2025-vs2026
            toolset: ''
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -prerelease -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'No Visual Studio installation with C++ build tools found' }
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          Import-Module (Join-Path $vsPath 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          $devArgs = '-arch=x64 -host_arch=x64'
          if ('${{ matrix.toolset }}') { $devArgs += ' -vcvars_ver=${{ matrix.toolset }}' }
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments $devArgs
          Get-ChildItem env: |
            Where-Object { $_.Name -ne 'GITHUB_ENV' -and $before[$_.Name] -ne $_.Value } |
            ForEach-Object { "$($_.Name)=$($_.Value)" } |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Get-Command cl.exe -ErrorAction Stop | Select-Object -ExpandProperty Source
          cl 2>&1 | Select-Object -First 1
          exit 0

      - name: 'workaround.cpp — control, must compile'
        run: cl /nologo /std:c++20 /EHsc /W4 /c workaround.cpp

      - name: 'repro.cpp — a red X here means the ICE is still present'
        run: cl /nologo /std:c++20 /EHsc /W4 /c repro.cpp
